name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests & assemble APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Audit merged manifest for forbidden offline permissions
        run: |
          MANIFEST="app/build/intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml"
          test -f "$MANIFEST"
          for perm in "android.permission.INTERNET" "android.permission.ACCESS_NETWORK_STATE" "android.permission.RECORD_AUDIO"; do
            if grep -q "$perm" "$MANIFEST"; then
              echo "ERROR: Forbidden permission found in merged manifest: $perm"
              exit 1
            fi
          done

      - name: Stage versioned APK artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "droidamp-${GITHUB_REF_NAME}-debug.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *"-alpha"* || "$TAG" == *"-beta"* || "$TAG" == *"-rc"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" "droidamp-${TAG}-debug.apk" \
            --title "DroidAmp ${TAG}" \
            --generate-notes \
            $PRERELEASE_FLAG
