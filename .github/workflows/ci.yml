name: Android CI

on:
  push:
    branches: [master, release]
  pull_request:
    branches: [master, release]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM unit tests & assemble debug APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Audit merged manifest for forbidden offline permissions
        run: |
          MANIFEST="app/build/intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml"
          test -f "$MANIFEST"
          for perm in "android.permission.INTERNET" "android.permission.ACCESS_NETWORK_STATE" "android.permission.RECORD_AUDIO"; do
            if grep -q "$perm" "$MANIFEST"; then
              echo "ERROR: Forbidden permission found in merged manifest: $perm"
              exit 1
            fi
          done
          echo "Offline manifest audit passed (zero INTERNET, ACCESS_NETWORK_STATE, or RECORD_AUDIO)."
